---
layout: default
---

<article class="post">
    <header class="post-header">
        <h1>{{ page.title }}</h1>
        <p class="post-meta">
            Published on {{ page.date | date: "%B %d, %Y" }}
            {% if page.author %} by {{ page.author }}{% endif %}
        </p>
    </header>

    <div class="post-content">
        {{ content }}
    </div>

    <footer class="post-footer">
        <p>📸 Follow us on <a href="https://instagram.com/Fez_Flavores">Instagram @Fez_Flavores</a></p>
    </footer>
</article>
