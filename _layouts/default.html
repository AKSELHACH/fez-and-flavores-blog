<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if page.title %}
            {{ page.title }} |
        {% endif %}
        {{ site.title }}
    </title>

    <meta name="description" content="{{ site.description }}">

    <link rel="stylesheet"
          href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>
    <header>
        <div class="container">
            <h1>
                <a href="{{ '/' | relative_url }}">
                    🌿 Fez & Flavores
                </a>
            </h1>

            <p class="tagline">{{ site.description }}</p>

            <nav class="main-nav" aria-label="Main navigation">
    <a href="{{ '/' | relative_url }}">
        Home
    </a>

    <a href="{{ '/products/' | relative_url }}">
        Products &amp; Menu
    </a>

    <a href="{{ '/recipes/' | relative_url }}">
        Recipes
    </a>

    <a href="{{ '/moroccan-food-stories/' | relative_url }}">
        Moroccan Food Stories
    </a>

    <a href="{{ '/french-pastry/' | relative_url }}">
        French Pastry
    </a>

    <a href="{{ '/behind-the-scenes/' | relative_url }}">
        Behind the Scenes
    </a>

    <a href="{{ '/about/' | relative_url }}">
        About Fez &amp; Flavores
    </a>

    <a href="{{ '/order/' | relative_url }}" class="nav-order">
        Order
    </a>
</nav>
        </div>
    </header>

    <main>
        <div class="container">
            {{ content }}
        </div>
    </main>

    <footer>
        <div class="container">
            <p>
                &copy; {{ site.time | date: "%Y" }}
                Fez & Flavores. All rights reserved.
            </p>

            <p>
                Follow us on
                <a href="https://instagram.com/Fez_Flavores"
                   target="_blank"
                   rel="noopener noreferrer">
                    Instagram @Fez_Flavores
                </a>
            </p>
        </div>
    </footer>
</body>
</html>
